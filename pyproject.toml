[project]
name = "ComfyUI-ImagePathSelector"
description = "This node loads all images from the selected folder and displays them in a grid. The user can click any image to automatically execute the ComfyUI workflow. Additionally, it supports many RAW image formats as well as HEIC formats."
version = "1.0.4"
license = {file = "LICENSE"}
